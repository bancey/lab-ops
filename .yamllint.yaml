---
extends: default

rules:
  line-length: disable
  document-start: disable
  new-line-at-end-of-file: disable
  comments-indentation: disable
  empty-lines:
    max: 1
  comments:
    min-spaces-from-content: 1
    require-starting-space: false
  indentation:
    spaces: 2
    indent-sequences: consistent
  braces:
    max-spaces-inside: 10
  commas:
    max-spaces-before: 2
    max-spaces-after: 2
    min-spaces-after: 0
  colons:
    max-spaces-before: 2
    max-spaces-after: 2
  brackets:
    max-spaces-inside: 10
  hyphens:
    max-spaces-after: 4

# SOPS output is machine-generated and its layout is chosen by sops' own YAML emitter, not by
# us: sops 3.10 indents nested mappings by four spaces where this config wants two, so every
# file rendered by terraform/components/entra would fail the indentation rule. The content is
# ciphertext, so its formatting carries no meaning worth linting.
ignore: |
  *.sops.yaml
