---
# Runs on the controller after the routers have enrolled. Policies, configs and services
# are owned by terraform/components/openziti, not by this file.
# Relies on the CLI session from controller.yaml.

# The embedded tunneler of a tunneler-enabled router gets an identity with the
# router's name. Service policies select identities, not routers, so the router's
# role attributes are mirrored onto that identity for the Bind policy to match.
- name: Tag router tunneler identities
  ansible.builtin.shell: |
    set -euo pipefail
    current="$(ziti edge list identities {{ ('name="' ~ router.name ~ '"') | quote }} -j | jq -c '[.data[0].roleAttributes // [] | .[]] | sort')"
    if [ "$current" != {{ router.role_attributes | sort | to_json(separators=(',', ':')) | quote }} ]; then
      ziti edge update identity {{ router.name | quote }} --role-attributes {{ router.role_attributes | join(',') | quote }}
      echo updated
    fi
  args:
    executable: /bin/bash
  vars:
    router: "{{ hostvars[item].openziti_router }}"
  loop: "{{ groups['openziti_routers'] }}"
  loop_control:
    label: "{{ item }}"
  register: openziti_result
  changed_when: openziti_result.stdout | length > 0
  when:
    - not ansible_check_mode
    - hostvars[item].openziti_router.tunneler_enabled | bool

# External authentication. Signers and auth policies are reconciled: created if missing,
# otherwise patched to match on every run.
# Changes are detected by comparing the object before and after.
#
# The auth policy names its signers and the signer names the auth policy that
# auto-enrolled identities get, so the enrollment policy is set in a third step.
- name: Create or update external JWT signers
  ansible.builtin.shell: |
    set -euo pipefail
    state() {
      ziti edge list ext-jwt-signers {{ ('name="' ~ item.name ~ '"') | quote }} -j \
        | jq -S '.data[0] // {} | del(.updatedAt, ._links)'
    }
    flags=(
      --jwks-endpoint {{ item.jwks_endpoint | quote }}
      --external-auth-url {{ item.external_auth_url | default('') | quote }}
      --client-id {{ item.client_id | default('') | quote }}
      --audience {{ item.audience | default('') | quote }}
      --scopes {{ item.scopes | default([]) | join(',') | quote }}
      --target-token {{ item.target_token | default('ACCESS') | quote }}
      --claims-property {{ item.claims_property | default('sub') | quote }}
      --enroll-to-cert={{ item.enroll_to_cert | default(false) | bool | string | lower }}
      --enroll-to-token={{ item.enroll_to_token | default(false) | bool | string | lower }}
      --enroll-name-claims-selector {{ item.enroll_name_claims_selector | default('') | quote }}
      --enroll-attr-claims-selector {{ item.enroll_attr_claims_selector | default('') | quote }}
    )
    before="$(state)"
    if [ "$before" = "{}" ]; then
      ziti edge create ext-jwt-signer {{ item.name | quote }} {{ item.issuer | quote }} \
        --external-id=true "${flags[@]}" > /dev/null
    else
      ziti edge update ext-jwt-signer {{ item.name | quote }} --issuer {{ item.issuer | quote }} \
        --use-external-id=true "${flags[@]}" > /dev/null
    fi
    [ "$(state)" = "$before" ] || echo changed
  args:
    executable: /bin/bash
  loop: "{{ openziti_ext_jwt_signers }}"
  loop_control:
    label: "{{ item.name }}"
  register: openziti_result
  changed_when: openziti_result.stdout | length > 0
  when: not ansible_check_mode

- name: Create or update auth policies
  ansible.builtin.shell: |
    set -euo pipefail
    state() {
      ziti edge list auth-policies {{ ('name="' ~ item.name ~ '"') | quote }} -j \
        | jq -S '.data[0] // {} | del(.updatedAt, ._links)'
    }
    # The API takes signer IDs, not names. An empty list would allow any signer.
    signers=()
    {% for signer in item.ext_jwt_allowed_signers | default([]) %}
    id="$(ziti edge list ext-jwt-signers {{ ('name="' ~ signer ~ '"') | quote }} -j | jq -r '.data[0].id // empty')"
    if [ -z "$id" ]; then echo "ext-jwt-signer {{ signer }} not found" >&2; exit 1; fi
    signers+=(--primary-ext-jwt-allowed-signers "$id")
    {% endfor %}
    flags=(
      --primary-cert-allowed={{ item.cert_allowed | default(true) | bool | string | lower }}
      --primary-ext-jwt-allowed={{ item.ext_jwt_allowed | default(false) | bool | string | lower }}
      --primary-updb-allowed={{ item.updb_allowed | default(false) | bool | string | lower }}
      "${signers[@]}"
    )
    before="$(state)"
    if [ "$before" = "{}" ]; then
      ziti edge create auth-policy {{ item.name | quote }} "${flags[@]}" > /dev/null
    else
      ziti edge update auth-policy {{ item.name | quote }} "${flags[@]}" > /dev/null
    fi
    [ "$(state)" = "$before" ] || echo changed
  args:
    executable: /bin/bash
  loop: "{{ openziti_auth_policies }}"
  loop_control:
    label: "{{ item.name }}"
  register: openziti_result
  changed_when: openziti_result.stdout | length > 0
  when: not ansible_check_mode

- name: Set the auth policy for identities enrolled by each signer
  ansible.builtin.shell: |
    set -euo pipefail
    current="$(ziti edge list ext-jwt-signers {{ ('name="' ~ item.name ~ '"') | quote }} -j | jq -r '.data[0].enrollAuthPolicyId // empty')"
    wanted="$(ziti edge list auth-policies {{ ('name="' ~ item.enroll_auth_policy ~ '"') | quote }} -j | jq -r '.data[0].id // empty')"
    if [ -z "$wanted" ]; then echo "auth-policy {{ item.enroll_auth_policy }} not found" >&2; exit 1; fi
    if [ "$current" != "$wanted" ]; then
      ziti edge update ext-jwt-signer {{ item.name | quote }} --enroll-auth-policy "$wanted" > /dev/null
      echo changed
    fi
  args:
    executable: /bin/bash
  loop: "{{ openziti_ext_jwt_signers | selectattr('enroll_auth_policy', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: openziti_result
  changed_when: openziti_result.stdout | length > 0
  when: not ansible_check_mode

# Leftovers from removed configuration. Auth policies go first because they reference
# signers. Every client lists every enabled signer, so a stale one shows up as an extra
# provider in the tunnelers and the console.
- name: Delete removed auth policies
  ansible.builtin.shell: |
    set -euo pipefail
    id="$(ziti edge list auth-policies {{ ('name="' ~ item ~ '"') | quote }} -j | jq -r '.data[0].id // empty')"
    [ -n "$id" ] || exit 0
    users="$(ziti edge list identities 'limit none' -j | jq -r --arg p "$id" '[.data[] | select(.authPolicyId == $p) | .name] | join(", ")')"
    if [ -n "$users" ]; then
      echo "auth-policy {{ item }} is still assigned to: $users. Move or delete them first." >&2
      exit 1
    fi
    ziti edge delete auth-policy -- "$id" > /dev/null
    echo changed
  args:
    executable: /bin/bash
  loop: "{{ openziti_removed_auth_policies }}"
  register: openziti_result
  changed_when: openziti_result.stdout | length > 0
  when: not ansible_check_mode

- name: Delete removed external JWT signers
  ansible.builtin.shell: |
    set -euo pipefail
    id="$(ziti edge list ext-jwt-signers {{ ('name="' ~ item ~ '"') | quote }} -j | jq -r '.data[0].id // empty')"
    [ -n "$id" ] || exit 0
    ziti edge delete ext-jwt-signer -- "$id" > /dev/null
    echo changed
  args:
    executable: /bin/bash
  loop: "{{ openziti_removed_ext_jwt_signers }}"
  register: openziti_result
  changed_when: openziti_result.stdout | length > 0
  when: not ansible_check_mode

# Administrators: the listed users' own Entra-enrolled identities get isAdmin, and every
# other identity with an external ID loses it. Identities without an external ID (the
# default admin, router tunnelers, JWT identities) are never touched.
#
# The CLI can't change isAdmin on an existing identity, so this PATCHes the management API
# over loopback with its own short-lived session. Credentials go to curl on stdin, never
# on the command line. Ziti IDs can start with "-", hence the jq-built URLs.
- name: Reconcile administrator identities
  ansible.builtin.shell: |
    set -euo pipefail
    api=https://localhost:{{ openziti_ctrl_port }}/edge/management/v1
    ca=/var/lib/ziti-controller/pki/root/certs/root.cert
    token="$(jq -n '{username: env.ZITI_USER, password: env.ZITI_PWD}' \
      | curl -sSf --cacert "$ca" -H 'Content-Type: application/json' --data @- "$api/authenticate?method=password" \
      | jq -r '.data.token // empty')"
    if [ -z "$token" ]; then echo "could not log in to the management API" >&2; exit 1; fi
    trap 'curl -sS --cacert "$ca" -H "zt-session: $token" -X DELETE "$api/current-api-session" > /dev/null || true' EXIT

    identities="$(ziti edge list identities 'limit none' -j)"
    wanted={{ openziti_admins | map(attribute='oid') | list | to_json | quote }}

    # Listed users who haven't enrolled yet can't be made admin; say so but carry on
    jq -r --argjson want "$wanted" '[.data[].externalId] as $have | $want[] | select(IN($have[]) | not)' <<<"$identities" \
      | while read -r oid; do echo "no identity has external ID $oid yet; sign in with a tunneler first" >&2; done

    jq -c --argjson want "$wanted" '.data[]
        | select((.externalId // "") != "")
        | {id, name, isAdmin: (.isAdmin // false), admin: (.externalId | IN($want[]))}
        | select(.admin != .isAdmin)' <<<"$identities" \
      | while read -r change; do
          url="$(jq -r --arg api "$api" '$api + "/identities/" + (.id | @uri)' <<<"$change")"
          jq -c '{isAdmin: .admin}' <<<"$change" \
            | curl -sSf --cacert "$ca" -H "zt-session: $token" -H 'Content-Type: application/json' \
                -X PATCH --data @- "$url" > /dev/null
          jq -r '"\(.name): isAdmin=\(.admin)"' <<<"$change"
        done
  args:
    executable: /bin/bash
  environment:
    ZITI_USER: "{{ openziti_admin_username }}"
    ZITI_PWD: "{{ openziti_admin_password }}"
  register: openziti_result
  changed_when: openziti_result.stdout | length > 0
  when: not ansible_check_mode

- name: Create client identities
  ansible.builtin.shell: |
    set -euo pipefail
    if [ "$(ziti edge list identities {{ ('name="' ~ item.name ~ '"') | quote }} -j | jq '.data | length')" -eq 0 ]; then
      ziti edge create identity {{ item.name | quote }} \
        --role-attributes {{ item.role_attributes | join(',') | quote }} \
        --jwt-output-file {{ (openziti_artifacts_dir ~ '/' ~ item.name ~ '.jwt') | quote }}
    fi
  args:
    executable: /bin/bash
  loop: "{{ openziti_identities }}"
  loop_control:
    label: "{{ item.name }}"
  register: openziti_result
  changed_when: openziti_result.stdout | length > 0
  when: not ansible_check_mode
