---
# Serves the client API on a second, publicly trusted name and port so users can
# "join by URL" (https://<openziti_public_api_address>) without a JWT. The OS has to
# trust the certificate the controller presents there, and the controller's own PKI
# isn't trusted, so this listener presents a Let's Encrypt certificate instead.
#
# The certificate (tls_cert.yaml) is bound with alt_server_certs, which the controller
# picks by SNI. Its name must not overlap the PKI server cert's SANs
# (openziti_ctrl_address), so routers and enrolled clients keep getting the PKI cert on
# the original address.
#
# Runs between bootstrap and service start in controller.yaml, because the listener
# can only be added once config.yml exists and the controller won't start if a
# certificate it references is missing.

- name: Check the public API settings
  ansible.builtin.assert:
    that:
      - openziti_public_api_address | length > 0
    fail_msg: openziti_public_api_address must be set
    quiet: true

- name: Issue the public API certificate
  ansible.builtin.include_tasks: tls_cert.yaml
  vars:
    openziti_tls_domain: "{{ openziti_public_api_address }}"
    openziti_tls_dir: "{{ openziti_public_api_cert_dir }}"
    # Already recorded in certbot's renewal config for this certificate
    openziti_tls_hook: /usr/local/bin/openziti-public-cert-deploy.sh

# The controller runs as an unprivileged user, so binding below 1024 needs this
- name: Ensure the controller drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/ziti-controller.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Allow the controller to bind privileged ports
  ansible.builtin.copy:
    dest: /etc/systemd/system/ziti-controller.service.d/bind-privileged-ports.conf
    content: |
      # Managed by Ansible (roles/openziti/tasks/public_api.yaml)
      [Service]
      AmbientCapabilities=CAP_NET_BIND_SERVICE
    owner: root
    group: root
    mode: '0644'
  register: openziti_public_api_dropin

- name: Check for the controller config
  ansible.builtin.stat:
    path: /var/lib/ziti-controller/config.yml
  register: openziti_config_file

- name: Read the controller config
  ansible.builtin.slurp:
    src: /var/lib/ziti-controller/config.yml
  register: openziti_config_raw
  when: openziti_config_file.stat.exists

# Rebuilt from the bootstrap-generated client-management listener each run, so it
# follows that listener's identity and options. Management APIs aren't exposed on
# it. The first run rewrites config.yml without its comments; a backup is kept.
- name: Add the public client API listener to the controller config
  ansible.builtin.copy:
    dest: /var/lib/ziti-controller/config.yml
    content: "{{ config | combine({'web': web}) | to_nice_yaml(indent=2, sort_keys=false) }}"
    backup: true
  vars:
    config: "{{ openziti_config_raw.content | b64decode | from_yaml }}"
    base: "{{ config.web | selectattr('name', 'equalto', 'client-management') | first }}"
    listener:
      name: client-public
      bindPoints:
        - interface: "0.0.0.0:{{ openziti_public_api_port }}"
          address: "{{ openziti_public_api_address }}:{{ openziti_public_api_port }}"
      identity: "{{ base.identity | combine({'alt_server_certs': [{'server_cert': openziti_public_api_cert_dir ~ '/fullchain.pem', 'server_key': openziti_public_api_cert_dir ~ '/privkey.pem'}]}) }}"
      options: "{{ base.options | default({}) }}"
      apis:
        - binding: edge-client
          options: {}
        - binding: edge-oidc
          options: {}
    web: "{{ (config.web | rejectattr('name', 'equalto', 'client-public') | list) + [listener] }}"
  register: openziti_public_api_config
  when: openziti_config_file.stat.exists

- name: Restart controller to load the public API listener
  ansible.builtin.systemd:
    name: ziti-controller
    state: restarted
    daemon_reload: true
  when:
    - not ansible_check_mode
    - openziti_public_api_dropin is changed or openziti_public_api_config is changed

- name: Wait for the public API
  ansible.builtin.wait_for:
    port: "{{ openziti_public_api_port }}"
    host: 127.0.0.1
    timeout: 120
  when:
    - not ansible_check_mode
    - openziti_public_api_dropin is changed or openziti_public_api_config is changed
