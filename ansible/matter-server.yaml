---
- name: Deploy Matter Server and Thread Border Router on LXC Container
  hosts: matter-server
  become: true
  gather_facts: true

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Add Docker GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present
        keyring: /etc/apt/keyrings/docker.gpg

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure Docker service is started and enabled
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Create Matter Server data directory
      ansible.builtin.file:
        path: /opt/matter-server/data
        state: directory
        mode: '0755'

    - name: Create OTBR (Thread Border Router) data directory
      ansible.builtin.file:
        path: /opt/matter-server/otbr-data
        state: directory
        mode: '0755'

    # OTBR (network_mode: host) enables IPv6 forwarding on its infra interface
    # (eth0) as part of its border-routing role. Linux silently stops
    # processing incoming Router Advertisements on any interface once
    # forwarding is enabled for it, unless accept_ra is explicitly set to 2
    # to override that — without this, OTBR never sees UniFi's RAs on the
    # Services VLAN and its border-routing manager can't function correctly.
    - name: Enable IPv6 forwarding and RA processing for OTBR's border-routing role
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        sysctl_set: true
        reload: true
      loop:
        - { name: 'net.ipv6.conf.all.forwarding', value: '1' }
        - { name: 'net.ipv4.conf.all.forwarding', value: '1' }
        - { name: 'net.ipv6.conf.all.accept_ra', value: '2' }
        - { name: 'net.ipv6.conf.all.accept_ra_rt_info_max_plen', value: '64' }

    - name: Create Matter Server Docker Compose file
      ansible.builtin.copy:
        dest: /opt/matter-server/docker-compose.yaml
        mode: '0644'
        content: |
          version: '3.8'
          services:
            matter-server:
              image: ghcr.io/matter-js/python-matter-server:stable
              container_name: matter-server
              restart: unless-stopped
              network_mode: host
              security_opt:
                - apparmor:unconfined
              volumes:
                - /opt/matter-server/data:/data
                - /run/dbus:/run/dbus:ro
              command: --storage-path /data --paa-root-cert-dir /data/credentials
              environment:
                - TZ=Europe/London

            # Thread Border Router for the SLZB-MR1U's second (Thread) radio.
            # Runs alongside matter-server on the same host so mDNS discovery
            # of the Thread border agent works without cross-subnet reflection
            # (the SLZB-MR1U's Zigbee/Thread radios live on 10.151.13.0/24,
            # this LXC is on 10.151.14.0/24).
            otbr:
              image: bnutzer/otbr-tcp:latest
              container_name: otbr
              restart: unless-stopped
              privileged: true
              network_mode: host
              devices:
                - /dev/net/tun
              volumes:
                - /opt/matter-server/otbr-data:/var/lib/thread
              environment:
                - TZ=Europe/London
                # SLZB-MR1U's Thread radio (RCP), exposed over the network
                # separately from its Zigbee radio (10.151.13.6:6638, used
                # by zigbee2mqtt).
                - RCP_HOST=10.151.13.6
                - RCP_PORT=7638
                - RCP_BAUDRATE=460800
                - OTBR_WEB_ENABLE=1

    - name: Start Matter Server and OTBR containers
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: /opt/matter-server
      register: docker_compose_result
      changed_when: "'Started' in docker_compose_result.stdout or 'Creating' in docker_compose_result.stdout"

    - name: Wait for Matter Server to be ready
      ansible.builtin.wait_for:
        port: 5580
        delay: 5
        timeout: 60

    - name: Wait for OTBR web interface to be ready
      ansible.builtin.wait_for:
        port: 8080
        delay: 5
        timeout: 60

    - name: Display container status
      ansible.builtin.command:
        cmd: docker compose ps
        chdir: /opt/matter-server
      register: compose_ps
      changed_when: false

    - name: Show container status
      ansible.builtin.debug:
        var: compose_ps.stdout_lines
