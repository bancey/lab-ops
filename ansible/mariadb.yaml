- name: Install and configure MariaDB Galera Cluster
  hosts: mariadb0, mariadb1, mariadb2
  gather_facts: true
  vars:
    galera_cluster_name: "galera_cluster"
    galera_nodes: ["10.151.14.210", "10.151.14.211", "10.151.14.212"]
    mariadb_bind_address: "0.0.0.0"
    mariadb_datadir: "/var/lib/mysql"
    enable_alloy: false
    mariadb_databases:
    - name: "bunkerweb"
      user: "bunkerweb"
      password: "{{ mariadb_bunkerweb_password }}"
    - name: "home-assistant"
      user: "homeassistant"
      password: "{{ mariadb_homeassistant_password }}"
    - name: "panel"
      user: "pelican"
      password: "{{ mariadb_pelican_password }}"
    backup_local_dir: "/var/backups/mariadb"
    backup_storage_account: "{{ backup_storage_account_name }}"
    backup_container: "mariadb-backups"
    # Local copies are only a staging area - Azure Blob is the backup of record. home-assistant
    # dumps alone are >3GB each, so long local retention fills the 50G disk shared with the datadir.
    backup_local_retention_days: 3
    # Both Gatus instances get the result; each alerts if no successful backup arrives within the
    # heartbeat interval (external endpoint "backups_mariadb" in the rpi-monitoring Gatus config).
    backup_gatus_urls:
    - "https://gatus.thanos.heimelska.co.uk"
    - "https://gatus.gamora.heimelska.co.uk"
    backup_gatus_endpoint_key: "backups_mariadb"
    backup_cron_hour: "2"
    backup_cron_minute: "0"
    mariadb_version: "11.4"
  pre_tasks:
  - name: Check if mariadb-server is in broken dpkg state before any apt operations
    ansible.builtin.shell:
      cmd: dpkg-query -W -f='${Status}' mariadb-server 2>/dev/null
    register: pre_mariadb_pkg_check
    failed_when: false
    changed_when: false
  - name: Check if Galera config exists (may cause dpkg post-install failure)
    ansible.builtin.stat:
      path: /etc/mysql/mariadb.conf.d/60-galera.cnf
    register: pre_galera_config_stat
  - name: Check if Galera dpkg-fix backup exists from a previous failed recovery
    ansible.builtin.stat:
      path: /etc/mysql/mariadb.conf.d/60-galera.cnf.dpkg-fix
    register: pre_galera_dpkg_fix_stat
  - name: Write wsrep_on override so MariaDB starts standalone during dpkg fix
    ansible.builtin.copy:
      dest: /etc/mysql/mariadb.conf.d/99-wsrep-disable.cnf
      content: "[mysqld]\nwsrep_on = OFF\n"
      owner: root
      group: root
      mode: '0644'
    when:
    - "'install ok installed' not in (pre_mariadb_pkg_check.stdout | default(''))"
    - (pre_galera_config_stat.stat.exists | default(false)) or (pre_galera_dpkg_fix_stat.stat.exists | default(false))
  - name: Restore Galera config from dpkg-fix backup if rename was left incomplete
    ansible.builtin.command:
      cmd: mv /etc/mysql/mariadb.conf.d/60-galera.cnf.dpkg-fix /etc/mysql/mariadb.conf.d/60-galera.cnf
      removes: /etc/mysql/mariadb.conf.d/60-galera.cnf.dpkg-fix
    when:
    - "'install ok installed' not in (pre_mariadb_pkg_check.stdout | default(''))"
    - pre_galera_dpkg_fix_stat.stat.exists | default(false)
  - name: Complete pending dpkg configuration with wsrep disabled
    ansible.builtin.command:
      cmd: dpkg --configure -a
    failed_when: false
    changed_when: true
    when:
    - "'install ok installed' not in (pre_mariadb_pkg_check.stdout | default(''))"
    - (pre_galera_config_stat.stat.exists | default(false)) or (pre_galera_dpkg_fix_stat.stat.exists | default(false))
  - name: Stop MariaDB after dpkg configuration completes
    ansible.builtin.service:
      name: mariadb
      state: stopped
    failed_when: false
    when:
    - "'install ok installed' not in (pre_mariadb_pkg_check.stdout | default(''))"
    - (pre_galera_config_stat.stat.exists | default(false)) or (pre_galera_dpkg_fix_stat.stat.exists | default(false))
  - name: Remove wsrep_on override after dpkg fix
    ansible.builtin.file:
      path: /etc/mysql/mariadb.conf.d/99-wsrep-disable.cnf
      state: absent
    when:
    - "'install ok installed' not in (pre_mariadb_pkg_check.stdout | default(''))"
    - (pre_galera_config_stat.stat.exists | default(false)) or (pre_galera_dpkg_fix_stat.stat.exists | default(false))
  - name: Verify mariadb-server dpkg configuration is now complete
    ansible.builtin.shell:
      cmd: dpkg-query -W -f='${Status}' mariadb-server 2>/dev/null
    register: pre_mariadb_pkg_verify
    changed_when: false
    failed_when: "'install ok installed' not in (pre_mariadb_pkg_verify.stdout | default(''))"
    when:
    - "'install ok installed' not in (pre_mariadb_pkg_check.stdout | default(''))"
    - (pre_galera_config_stat.stat.exists | default(false)) or (pre_galera_dpkg_fix_stat.stat.exists | default(false))
  roles:
  - role: prep
    install_pkgs: ["apt-transport-https", "ca-certificates", "curl", "gnupg", "software-properties-common", "python3-pip", "python3-setuptools"]
    disable_multipath: false
  tasks:
  - set_fact:
      mariadb_root_password: "{{ lookup('ansible.builtin.file', 'mariadb_root_password') }}"
    when: mariadb_root_password is undefined
  - set_fact:
      mariadb_galera_password: "{{ lookup('ansible.builtin.file', 'mariadb_galera_password') }}"
    when: mariadb_galera_password is undefined
  - set_fact:
      proxysql_monitor_password: "{{ lookup('ansible.builtin.file', 'proxysql_monitor_password') }}"
    when: proxysql_monitor_password is undefined
  - set_fact:
      alloy_mysql_password: "{{ lookup('ansible.builtin.file', 'alloy_mysql_password') }}"
    when: alloy_mysql_password is undefined and enable_alloy | bool
  - set_fact:
      backup_sas_token: "{{ lookup('ansible.builtin.file', 'backup_sas_token') }}"
    when: backup_sas_token is undefined
  # Optional: without it the backup still runs but reports nothing, so once Gatus has the token
  # its heartbeat alert fires - the right signal that this side isn't wired up.
  - set_fact:
      gatus_external_endpoint_token: "{{ lookup('ansible.builtin.file', 'gatus_external_endpoint_token', errors='ignore') | default('', true) | trim }}"
    when: gatus_external_endpoint_token is undefined
  - name: Load database passwords from secret files
    set_fact:
      mariadb_databases_resolved: "{{ mariadb_databases_resolved | default([]) + [item | combine({'password': (lookup('ansible.builtin.file', item.password_var) if (item.password_var is defined and item.password_var | length > 0) else item.password)})] }}"
    loop: "{{ mariadb_databases }}"
    no_log: true
  # Cluster state is assessed on every node, not just mariadb0. A single dead node must never be
  # read as a full outage: that path stops the healthy nodes and bootstraps from the dead one,
  # turning a one-node failure into a full outage on stale data.
  - name: Check if MariaDB is already installed
    ansible.builtin.shell:
      cmd: dpkg-query -W -f='${Status}' mariadb-server 2>/dev/null
    register: mariadb_pkg_check
    failed_when: false
    changed_when: false
  - name: Check if MariaDB service is currently active
    ansible.builtin.shell:
      cmd: systemctl is-active mariadb
    register: mariadb_service_check
    failed_when: false
    changed_when: false
  - name: Check Galera cluster status via local MySQL socket
    ansible.builtin.shell:
      cmd: mysql -NBe "SHOW STATUS LIKE 'wsrep_cluster_status';" 2>/dev/null | awk '{print $2}'
    register: galera_cluster_status_check
    failed_when: false
    changed_when: false
    when: (mariadb_service_check.stdout | default('')) == 'active'
  - name: Record this node's install and Galera membership state
    set_fact:
      galera_node_installed: "{{ 'install ok installed' in (mariadb_pkg_check.stdout | default('')) }}"
      galera_node_primary: >-
        {{ (mariadb_service_check.stdout | default('')) == 'active'
           and (galera_cluster_status_check.stdout | default('') | lower) == 'primary' }}
  - name: Determine Galera bootstrap and recovery requirements from all nodes
    set_fact:
      galera_primary_nodes: "{{ ansible_play_hosts | select('in', galera_primary_candidates) | list }}"
      galera_any_installed: "{{ ansible_play_hosts | map('extract', hostvars, 'galera_node_installed') | map('bool') | select | list | length > 0 }}"
    vars:
      galera_primary_candidates: "{{ ansible_play_hosts | zip(ansible_play_hosts | map('extract', hostvars, 'galera_node_primary') | map('bool')) | selectattr(1) | map(attribute=0) | list }}"
  - name: Refuse to judge cluster health from a partial play
    ansible.builtin.fail:
      msg: >-
        No reachable node in this run is Primary, but only {{ ansible_play_hosts | join(', ') }}
        took part. Run against all Galera nodes (no --limit) so a healthy node elsewhere isn't
        mistaken for a full outage.
    when:
    - galera_primary_nodes | length == 0
    - galera_any_installed | bool
    - ansible_play_hosts | length < galera_nodes | length
  - name: Derive bootstrap decisions
    set_fact:
      # Bootstrap only when no node is part of a Primary component. Nodes that are down while
      # others are Primary simply get started below and rejoin via IST/SST.
      galera_bootstrap_required: "{{ galera_primary_nodes | length == 0 }}"
      galera_recover_full_outage: "{{ galera_primary_nodes | length == 0 and galera_any_installed | bool }}"
  - name: Check if Galera configuration already exists to detect broken install state
    ansible.builtin.stat:
      path: /etc/mysql/mariadb.conf.d/60-galera.cnf
    register: galera_config_stat
  - name: Check if Galera config dpkg-fix backup exists from a previous failed recovery
    ansible.builtin.stat:
      path: /etc/mysql/mariadb.conf.d/60-galera.cnf.dpkg-fix
    register: galera_config_dpkg_fix_stat
  - name: Determine if packages are in broken dpkg state with existing Galera config
    set_fact:
      galera_dpkg_broken: >-
        {{ ('install ok installed' not in (mariadb_pkg_check.stdout | default('')))
           and ((galera_config_stat.stat.exists | default(false))
                or (galera_config_dpkg_fix_stat.stat.exists | default(false))) }}
  - name: Stop MariaDB on all nodes before package installation
    ansible.builtin.service:
      name: mariadb
      state: stopped
    failed_when: false
    when: galera_bootstrap_required | bool
  - name: Download MariaDB apt keyring
    ansible.builtin.get_url:
      url: https://supplychain.mariadb.com/mariadb-keyring-2025.gpg
      dest: /usr/share/keyrings/mariadb-keyring-2025.gpg
      mode: '0644'
    when: not (galera_recover_full_outage | bool) and not (galera_dpkg_broken | default(false) | bool)
  - name: Add MariaDB repository sources file
    ansible.builtin.copy:
      dest: /etc/apt/sources.list.d/mariadb.list
      content: "deb [arch=amd64 signed-by=/usr/share/keyrings/mariadb-keyring-2025.gpg] https://dlm.mariadb.com/repo/mariadb-server/{{ mariadb_version }}/repo/ubuntu {{ ansible_facts['distribution_release'] }} main\n"
      owner: root
      group: root
      mode: '0644'
    when: not (galera_recover_full_outage | bool) and not (galera_dpkg_broken | default(false) | bool)
  - name: Install MariaDB and Galera packages
    apt:
      pkg:
      - mariadb-server
      - galera-4
      - mariadb-backup
      - python3-pymysql
      state: latest
      update_cache: true
    when: not ansible_check_mode and not (galera_recover_full_outage | bool) and not (galera_dpkg_broken | default(false) | bool)
  - name: Comment out default bind-address in 50-server.cnf
    ansible.builtin.replace:
      path: /etc/mysql/mariadb.conf.d/50-server.cnf
      regexp: '^(bind-address\s*=.*)$'
      replace: '# \1 # Managed by Ansible - overridden in 60-galera.cnf'
    when: not (galera_recover_full_outage | bool) and not (galera_dpkg_broken | default(false) | bool)
  - name: Copy Galera configuration template
    template:
      src: templates/galera.cnf.j2
      dest: /etc/mysql/mariadb.conf.d/60-galera.cnf
      owner: root
      group: mysql
      mode: '0640'
    notify:
    - Restart MariaDB
    when: not (galera_recover_full_outage | bool) and not (galera_dpkg_broken | default(false) | bool)
  - name: Temporarily rename Galera config to allow dpkg --configure -a to succeed
    ansible.builtin.command:
      cmd: mv /etc/mysql/mariadb.conf.d/60-galera.cnf /etc/mysql/mariadb.conf.d/60-galera.cnf.dpkg-fix
      creates: /etc/mysql/mariadb.conf.d/60-galera.cnf.dpkg-fix
    when: galera_dpkg_broken | default(false) | bool and (galera_config_stat.stat.exists | default(false))
  - name: Write wsrep_on override to guarantee MariaDB starts standalone during dpkg configure
    ansible.builtin.copy:
      dest: /etc/mysql/mariadb.conf.d/99-wsrep-disable.cnf
      content: "[mysqld]\nwsrep_on = OFF\n"
      owner: root
      group: root
      mode: '0644'
    when: galera_dpkg_broken | default(false) | bool
  - name: Complete pending dpkg package configuration with Galera disabled
    ansible.builtin.command:
      cmd: dpkg --configure -a
    failed_when: false
    when: galera_dpkg_broken | default(false) | bool
  - name: Stop MariaDB after dpkg --configure -a completes
    ansible.builtin.service:
      name: mariadb
      state: stopped
    failed_when: false
    when: galera_dpkg_broken | default(false) | bool
  - name: Remove wsrep_on override after dpkg configuration
    ansible.builtin.file:
      path: /etc/mysql/mariadb.conf.d/99-wsrep-disable.cnf
      state: absent
    when: galera_dpkg_broken | default(false) | bool
  - name: Restore Galera config after dpkg configuration
    ansible.builtin.command:
      cmd: mv /etc/mysql/mariadb.conf.d/60-galera.cnf.dpkg-fix /etc/mysql/mariadb.conf.d/60-galera.cnf
      removes: /etc/mysql/mariadb.conf.d/60-galera.cnf.dpkg-fix
    when: galera_dpkg_broken | default(false) | bool
  - name: Verify dpkg configuration completed successfully after recovery
    ansible.builtin.shell:
      cmd: dpkg-query -W -f='${Status}' mariadb-server 2>/dev/null
    register: mariadb_dpkg_verify
    changed_when: false
    failed_when: "'install ok installed' not in (mariadb_dpkg_verify.stdout | default(''))"
    when: galera_dpkg_broken | default(false) | bool
  - name: Stop MariaDB on all nodes before Galera bootstrap
    ansible.builtin.service:
      name: mariadb
      state: stopped
    failed_when: false
    when: galera_bootstrap_required | bool
  # After a full outage the node with the highest recovered seqno holds the newest data and must
  # be the bootstrap node. grastate.dat alone is not enough: after an unclean stop it shows
  # seqno -1, so ask InnoDB via --wsrep-recover. A node with a zeroed UUID or no recoverable
  # position (e.g. a datadir wiped by a failed SST) is never a candidate.
  - name: Recover last committed Galera position on each node
    ansible.builtin.shell:
      cmd: |
        log=$(mktemp)
        mariadbd --user=mysql --wsrep-recover --log-error="$log" >/dev/null 2>&1 || true
        grep -oP 'WSREP: Recovered position: \K\S+' "$log" | tail -n 1
        rm -f "$log"
    register: galera_recovered_position
    changed_when: false
    when: galera_recover_full_outage | bool
  - name: Record recovered Galera position
    set_fact:
      galera_recovered_uuid: "{{ (galera_recovered_position.stdout | default('')).split(':')[0] }}"
      galera_recovered_seqno: >-
        {{ ((galera_recovered_position.stdout | default('')).split(':') | last) | int(-1)
           if ':' in (galera_recovered_position.stdout | default('')) else -1 }}
    when: galera_recover_full_outage | bool
  - name: Choose Galera bootstrap node
    set_fact:
      galera_bootstrap_node: >-
        {%- if galera_recover_full_outage | bool -%}
        {%- set ns = namespace(node='', seqno=-1) -%}
        {%- for h in ansible_play_hosts -%}
        {%- set uuid = hostvars[h].galera_recovered_uuid | default('') -%}
        {%- set seqno = hostvars[h].galera_recovered_seqno | default(-1) | int -%}
        {%- if uuid | length > 0 and uuid != '00000000-0000-0000-0000-000000000000' and seqno > ns.seqno -%}
        {%- set ns.node = h -%}{%- set ns.seqno = seqno -%}
        {%- endif -%}
        {%- endfor -%}
        {{ ns.node }}
        {%- else -%}
        mariadb0
        {%- endif -%}
    when: galera_bootstrap_required | bool
  - name: Report recovered Galera positions
    ansible.builtin.debug:
      msg: "Recovered position {{ galera_recovered_position.stdout | default('none') }}; bootstrap node: {{ galera_bootstrap_node | default('n/a') }}"
    when: galera_recover_full_outage | bool
  - name: Fail if no node has a recoverable Galera position
    ansible.builtin.fail:
      msg: >-
        Full outage detected but no node has a recoverable Galera position. Refusing to bootstrap
        from a possibly empty datadir - recover manually (see docs/mariadb-operations.md).
    when: galera_bootstrap_required | bool and galera_bootstrap_node | length == 0
  - name: Mark the bootstrap node safe_to_bootstrap for full outage recovery
    ansible.builtin.replace:
      path: /var/lib/mysql/grastate.dat
      regexp: '^safe_to_bootstrap:.*$'
      replace: 'safe_to_bootstrap: 1'
    when:
    - galera_recover_full_outage | bool
    - inventory_hostname == galera_bootstrap_node
  - name: Clear safe_to_bootstrap on the other nodes for full outage recovery
    ansible.builtin.replace:
      path: /var/lib/mysql/grastate.dat
      regexp: '^safe_to_bootstrap:.*$'
      replace: 'safe_to_bootstrap: 0'
    failed_when: false
    when:
    - galera_recover_full_outage | bool
    - inventory_hostname != galera_bootstrap_node
  - name: Bootstrap Galera cluster on the chosen node
    ansible.builtin.command: galera_new_cluster
    when: galera_bootstrap_required | bool and inventory_hostname == galera_bootstrap_node
  # User and database changes replicate, so they run once on a node that is known to be Primary:
  # the bootstrap node after an outage, otherwise a healthy member (mariadb0 when it is one).
  - name: Choose node for user and database management
    set_fact:
      galera_admin_node: >-
        {{ galera_bootstrap_node if galera_bootstrap_required | bool
           else ('mariadb0' if 'mariadb0' in galera_primary_nodes else galera_primary_nodes | first) }}
  - name: Wait for MariaDB socket to be available before user and database tasks
    ansible.builtin.wait_for:
      path: /run/mysqld/mysqld.sock
      timeout: 60
    when: inventory_hostname == galera_admin_node
  - name: Set MariaDB root password
    community.mysql.mysql_user:
      name: root
      password: "{{ mariadb_root_password }}"
      login_unix_socket: /run/mysqld/mysqld.sock
      state: present
    when: inventory_hostname == galera_admin_node
  - name: Write root credentials file
    ansible.builtin.copy:
      dest: /root/.my.cnf
      content: |
        [client]
        user=root
        password={{ mariadb_root_password }}
      owner: root
      group: root
      mode: '0600'
  - name: Create Galera SST user
    community.mysql.mysql_user:
      name: galera_sst
      password: "{{ mariadb_galera_password }}"
      priv: "*.*:RELOAD,LOCK TABLES,PROCESS,REPLICATION CLIENT"
      host: "{{ item }}"
      login_unix_socket: /run/mysqld/mysqld.sock
      state: present
    loop: "{{ galera_nodes + ['localhost'] }}"
    when: inventory_hostname == galera_admin_node
  - name: Create ProxySQL monitor user
    community.mysql.mysql_user:
      name: proxysql_monitor
      password: "{{ proxysql_monitor_password }}"
      priv: "*.*:USAGE,REPLICATION CLIENT"
      host: "%"
      login_unix_socket: /run/mysqld/mysqld.sock
      state: present
    when: inventory_hostname == galera_admin_node
  - name: Start MariaDB on secondary nodes and enable after bootstrap
    ansible.builtin.service:
      name: mariadb
      state: started
      enabled: true
    when: galera_bootstrap_required | bool and inventory_hostname != galera_bootstrap_node
  - name: Wait for all Galera nodes to join after bootstrap
    ansible.builtin.shell:
      cmd: mysql -NBe "SHOW STATUS LIKE 'wsrep_cluster_size';" | awk '{print $2}'
    register: galera_cluster_size_check
    until: galera_cluster_size_check.stdout | int == ansible_play_hosts | length
    retries: 20
    delay: 10
    changed_when: false
    when: galera_bootstrap_required | bool and inventory_hostname == galera_bootstrap_node
  - name: Ensure MariaDB is started and enabled on all nodes (healthy cluster path)
    ansible.builtin.service:
      name: mariadb
      state: started
      enabled: true
    when: not (galera_bootstrap_required | bool)
  - name: Ensure MariaDB is enabled after bootstrap
    ansible.builtin.service:
      name: mariadb
      enabled: true
    when: galera_bootstrap_required | bool
  - name: Create application databases
    community.mysql.mysql_db:
      name: "{{ item.name }}"
      state: present
      login_unix_socket: /run/mysqld/mysqld.sock
    loop: "{{ mariadb_databases_resolved }}"
    when:
    - inventory_hostname == galera_admin_node
    - mariadb_databases_resolved | length > 0
  - name: Create application database users
    community.mysql.mysql_user:
      name: "{{ item.user }}"
      password: "{{ item.password }}"
      priv: "{{ item.name }}.*:{{ item.privs | default('ALL PRIVILEGES') }}"
      host: "{{ item.host | default('%') }}"
      login_unix_socket: /run/mysqld/mysqld.sock
      state: present
    loop: "{{ mariadb_databases_resolved }}"
    no_log: true
    when:
    - inventory_hostname == galera_admin_node
    - mariadb_databases_resolved | length > 0
  - name: Create Alloy monitoring user
    community.mysql.mysql_user:
      name: alloy_monitor
      password: "{{ alloy_mysql_password }}"
      priv: "*.*:PROCESS,REPLICATION CLIENT,SLAVE MONITOR,SELECT"
      host: "localhost"
      login_unix_socket: /run/mysqld/mysqld.sock
      state: present
    when: inventory_hostname == galera_admin_node and enable_alloy | bool
  - name: Add Grafana Alloy apt key
    ansible.builtin.get_url:
      url: https://apt.grafana.com/gpg.key
      dest: /etc/apt/keyrings/grafana.gpg
      mode: '0644'
    when: enable_alloy | bool
  - name: Add Grafana apt repository
    ansible.builtin.copy:
      dest: /etc/apt/sources.list.d/grafana.list
      content: "deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://apt.grafana.com stable main\n"
      owner: root
      group: root
      mode: '0644'
    when: enable_alloy | bool
  - name: Install Grafana Alloy
    apt:
      pkg:
      - alloy
      state: latest
      update_cache: true
    when: not ansible_check_mode and enable_alloy | bool
  - name: Copy Alloy configuration for MariaDB monitoring
    template:
      src: templates/alloy-mariadb.alloy.j2
      dest: /etc/alloy/config.alloy
      owner: alloy
      group: alloy
      mode: '0644'
    vars:
      alloy_mysql_user: "alloy_monitor"
    notify:
    - Restart Alloy
    when: enable_alloy | bool
  - name: Start and enable Alloy
    service:
      name: alloy
      state: started
      enabled: true
    when: enable_alloy | bool
  - name: Install azcopy
    block:
    - name: Download azcopy
      ansible.builtin.get_url:
        url: https://aka.ms/downloadazcopy-v10-linux
        dest: /tmp/azcopy.tar.gz
        mode: '0644'
    - name: Extract azcopy
      ansible.builtin.shell:
        cmd: tar -xzf /tmp/azcopy.tar.gz --strip-components=1 -C /usr/local/bin/ --wildcards '*/azcopy'
        creates: /usr/local/bin/azcopy
    - name: Set azcopy permissions
      ansible.builtin.file:
        path: /usr/local/bin/azcopy
        mode: '0755'
    when: inventory_hostname == 'mariadb0'
  - name: Ensure local backup directory exists
    ansible.builtin.file:
      path: "{{ backup_local_dir }}"
      state: directory
      owner: root
      group: root
      mode: '0750'
    when: inventory_hostname == 'mariadb0'
  - name: Create backup script
    ansible.builtin.copy:
      dest: /usr/local/bin/mariadb-backup.sh
      mode: '0750'
      owner: root
      group: root
      content: |
        #!/bin/bash
        # Every database is dumped and uploaded independently, so one failure doesn't stop the
        # rest; the overall result is reported to Gatus and reflected in the exit code.
        set -uo pipefail
        LOCAL_DIR="{{ backup_local_dir }}"
        STORAGE_ACCOUNT="{{ backup_storage_account }}"
        CONTAINER="{{ backup_container }}"
        SAS_TOKEN="{{ backup_sas_token }}"
        RETENTION_DAYS={{ backup_local_retention_days }}
        GATUS_URLS="{{ backup_gatus_urls | join(' ') }}"
        GATUS_KEY="{{ backup_gatus_endpoint_key }}"
        GATUS_TOKEN="{{ gatus_external_endpoint_token | default('') }}"
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        HOSTNAME=$(hostname)
        START=$(date +%s)
        FAILURES=()

        log() { echo "$(date '+%F %T') $*"; }

        report() {
          local success=$1 error=${2:-}
          [ -n "${GATUS_TOKEN}" ] || return 0
          for url in ${GATUS_URLS}; do
            curl -fsS -m 15 -X POST -H "Authorization: Bearer ${GATUS_TOKEN}" \
              --data-urlencode "success=${success}" --data-urlencode "error=${error}" \
              --data-urlencode "duration=$(( $(date +%s) - START ))s" -G \
              "${url}/api/v1/endpoints/${GATUS_KEY}/external" \
              || log "WARN: failed to report backup result to ${url}"
          done
        }

        # Prune before dumping, so yesterday's leftovers can't leave tonight's dump without room.
        find "${LOCAL_DIR}" -name '*.sql.gz*' -mtime +${RETENTION_DAYS} -delete

        STATE=$(mariadb -NBe "SHOW STATUS LIKE 'wsrep_local_state_comment';" 2>/dev/null | awk '{print $2}')
        if [ "${STATE}" != "Synced" ]; then
          log "ERROR: node is not a synced Galera member (state: '${STATE:-down}'), skipping backup"
          report false "${HOSTNAME} not synced (state: ${STATE:-down})"
          exit 1
        fi

        for DB in {{ mariadb_databases_resolved | map(attribute='name') | join(' ') }}; do
          FILE="${DB}_${HOSTNAME}_${TIMESTAMP}.sql.gz"
          DEST="${LOCAL_DIR}/${DB}"
          mkdir -p "${DEST}"
          log "Dumping ${DB}"
          if ! mariadb-dump --single-transaction --routines --triggers \
              --databases "${DB}" | gzip > "${DEST}/${FILE}.partial"; then
            rm -f "${DEST}/${FILE}.partial"
            FAILURES+=("dump ${DB}")
            continue
          fi
          mv "${DEST}/${FILE}.partial" "${DEST}/${FILE}"
          log "Uploading ${FILE}"
          if ! azcopy copy "${DEST}/${FILE}" \
              "https://${STORAGE_ACCOUNT}.blob.core.windows.net/${CONTAINER}/${DB}/${FILE}?${SAS_TOKEN}" \
              --log-level=ERROR --output-level=essential; then
            FAILURES+=("upload ${DB}")
          fi
        done

        if [ ${#FAILURES[@]} -gt 0 ]; then
          log "ERROR: backup failed: ${FAILURES[*]}"
          report false "failed: ${FAILURES[*]}"
          exit 1
        fi
        log "Backup completed"
        report true
    when: inventory_hostname == 'mariadb0'
  - name: Schedule nightly database backup via cron
    ansible.builtin.cron:
      name: "MariaDB nightly backup"
      hour: "{{ backup_cron_hour }}"
      minute: "{{ backup_cron_minute }}"
      job: "/usr/local/bin/mariadb-backup.sh >> /var/log/mariadb-backup.log 2>&1"
      user: root
    when: inventory_hostname == 'mariadb0'
  - name: Rotate backup log
    ansible.builtin.copy:
      dest: /etc/logrotate.d/mariadb-backup
      mode: '0644'
      content: |
        /var/log/mariadb-backup.log {
          weekly
          rotate 8
          compress
          missingok
          notifempty
        }
    when: inventory_hostname == 'mariadb0'
  handlers:
  - name: Restart MariaDB
    service:
      name: mariadb
      state: restarted
  - name: Restart Alloy
    service:
      name: alloy
      state: restarted

- name: Install and configure ProxySQL
  hosts: proxysql0, proxysql1, proxysql2
  gather_facts: true
  vars:
    galera_nodes: ["10.151.14.210", "10.151.14.211", "10.151.14.212"]
    mariadb_databases:
    - name: "bunkerweb"
      user: "bunkerweb"
      password: "{{ mariadb_bunkerweb_password }}"
    - name: "home-assistant"
      user: "homeassistant"
      password: "{{ mariadb_homeassistant_password }}"
    - name: "panel"
      user: "pelican"
      password: "{{ mariadb_pelican_password }}"
    enable_alloy: false
    vip: "10.151.14.219/24"
    keepalived_virtual_router_id: 152
    keepalive:
      proxysql0:
        peers: |-
          "10.151.14.217"
          "10.151.14.218"
        state: "MASTER"
        priority: 150
      proxysql1:
        peers: |-
          "10.151.14.216"
          "10.151.14.218"
        state: "BACKUP"
        priority: 100
      proxysql2:
        peers: |-
          "10.151.14.216"
          "10.151.14.217"
        state: "BACKUP"
        priority: 100
  roles:
  - role: prep
    install_pkgs: ["apt-transport-https", "ca-certificates", "curl", "gnupg", "software-properties-common", "python3-pymysql", "mariadb-client"]
    disable_multipath: false
  tasks:
  - set_fact:
      proxysql_admin_password: "{{ lookup('ansible.builtin.file', 'proxysql_admin_password') }}"
    when: proxysql_admin_password is undefined
  - set_fact:
      proxysql_monitor_password: "{{ lookup('ansible.builtin.file', 'proxysql_monitor_password') }}"
    when: proxysql_monitor_password is undefined
  - set_fact:
      keepalived_proxysql_pass: "{{ lookup('ansible.builtin.file', 'ProxySQL-Keepalived-Password') }}"
    when: keepalived_proxysql_pass is undefined
  - name: Load database passwords from secret files
    set_fact:
      mariadb_databases_resolved: "{{ mariadb_databases_resolved | default([]) + [item | combine({'password': (lookup('ansible.builtin.file', item.password_var) if (item.password_var is defined and item.password_var | length > 0) else item.password)})] }}"
    loop: "{{ mariadb_databases }}"
    no_log: true
  - name: ensures /etc/keepalived dir exists
    file:
      path: /etc/keepalived
      state: directory
  - name: Copy ProxySQL Keepalived health check script
    template:
      src: templates/check-proxysql.sh.j2
      dest: /usr/local/bin/check-proxysql.sh
      owner: root
      group: root
      mode: '0755'
  - name: Copy KeepAlived configuration template
    template:
      src: templates/keepalived-proxysql.conf.j2
      dest: /etc/keepalived/keepalived.conf
    vars:
      keepalived_pass: "{{ keepalived_proxysql_pass }}"
    notify:
    - Restart Keepalived
  - name: Update apt and install keepalived
    apt:
      pkg:
      - keepalived
      - libipset13
      state: latest
      update_cache: true
    when: not ansible_check_mode
  - name: Start and enable Keepalived
    service:
      name: keepalived
      state: started
      enabled: true
  - name: Download ProxySQL apt key
    ansible.builtin.get_url:
      url: https://repo.proxysql.com/ProxySQL/proxysql-3.0.x/repo_pub_key.gpg
      dest: /etc/apt/trusted.gpg.d/proxysql-3.0.x-keyring.gpg
      mode: '0644'
  - name: Add ProxySQL repository sources file
    ansible.builtin.copy:
      dest: /etc/apt/sources.list.d/proxysql.list
      content: "deb https://repo.proxysql.com/ProxySQL/proxysql-3.0.x/{{ ansible_facts['distribution_release'] }}/ ./\n"
      owner: root
      group: root
      mode: '0644'
  - name: Install ProxySQL
    apt:
      pkg:
      - proxysql
      state: latest
      update_cache: true
    when: not ansible_check_mode
  - name: Copy ProxySQL configuration template
    template:
      src: templates/proxysql.cnf.j2
      dest: /etc/proxysql.cnf
      owner: proxysql
      group: proxysql
      mode: '0600'
    notify:
    - Restart ProxySQL
  - name: Start and enable ProxySQL
    service:
      name: proxysql
      state: started
      enabled: true
  - name: Manage ProxySQL config via admin interface
    # community.mysql.mysql_query fails with "Module failed: 'version'" against ProxySQL's
    # admin interface because it doesn't speak the full MySQL protocol the module expects;
    # use the mysql CLI instead.
    environment:
      MYSQL_PWD: "{{ proxysql_admin_password }}"
    block:
    - name: Clear ProxySQL mysql_users
      ansible.builtin.command:
        argv: [mysql, --protocol=tcp, -h127.0.0.1, -P6032, -uadmin, -N, -B, -e, "DELETE FROM mysql_users"]
      changed_when: true
    - name: Add mysql_users to ProxySQL
      ansible.builtin.command:
        argv: [mysql, --protocol=tcp, -h127.0.0.1, -P6032, -uadmin, -N, -B, -e, "INSERT INTO mysql_users (username, password, default_hostgroup, active) VALUES ('{{ item.user }}', '{{ item.password }}', 0, 1)"]
      loop: "{{ mariadb_databases_resolved }}"
      no_log: true
      changed_when: true
    - name: Load mysql_users to runtime
      ansible.builtin.command:
        argv: [mysql, --protocol=tcp, -h127.0.0.1, -P6032, -uadmin, -N, -B, -e, "LOAD MYSQL USERS TO RUNTIME"]
      changed_when: true
    - name: Save mysql_users to disk
      ansible.builtin.command:
        argv: [mysql, --protocol=tcp, -h127.0.0.1, -P6032, -uadmin, -N, -B, -e, "SAVE MYSQL USERS TO DISK"]
      changed_when: true
    - name: Clear ProxySQL mysql_servers
      ansible.builtin.command:
        argv: [mysql, --protocol=tcp, -h127.0.0.1, -P6032, -uadmin, -N, -B, -e, "DELETE FROM mysql_servers"]
      changed_when: true
    - name: Add Galera nodes to ProxySQL writer hostgroup
      ansible.builtin.command:
        argv: [mysql, --protocol=tcp, -h127.0.0.1, -P6032, -uadmin, -N, -B, -e, "INSERT INTO mysql_servers (hostgroup_id, hostname, port, max_connections) VALUES (0, '{{ item }}', 3306, 100)"]
      loop: "{{ galera_nodes }}"
      changed_when: true
    - name: Add Galera nodes to ProxySQL reader hostgroup
      ansible.builtin.command:
        argv: [mysql, --protocol=tcp, -h127.0.0.1, -P6032, -uadmin, -N, -B, -e, "INSERT INTO mysql_servers (hostgroup_id, hostname, port, max_connections) VALUES (1, '{{ item }}', 3306, 100)"]
      loop: "{{ galera_nodes }}"
      changed_when: true
    - name: Load mysql_servers to runtime
      ansible.builtin.command:
        argv: [mysql, --protocol=tcp, -h127.0.0.1, -P6032, -uadmin, -N, -B, -e, "LOAD MYSQL SERVERS TO RUNTIME"]
      changed_when: true
    - name: Save mysql_servers to disk
      ansible.builtin.command:
        argv: [mysql, --protocol=tcp, -h127.0.0.1, -P6032, -uadmin, -N, -B, -e, "SAVE MYSQL SERVERS TO DISK"]
      changed_when: true
    - name: Clear ProxySQL mysql_galera_hostgroups
      ansible.builtin.command:
        argv: [mysql, --protocol=tcp, -h127.0.0.1, -P6032, -uadmin, -N, -B, -e, "DELETE FROM mysql_galera_hostgroups"]
      changed_when: true
    - name: Configure Galera hostgroups for single-writer mode
      ansible.builtin.command:
        argv:
        - mysql
        - --protocol=tcp
        - -h127.0.0.1
        - -P6032
        - -uadmin
        - -N
        - -B
        - -e
        - >-
          INSERT INTO mysql_galera_hostgroups
          (writer_hostgroup, backup_writer_hostgroup, reader_hostgroup,
          offline_hostgroup, active, max_writers, writer_is_also_reader,
          max_transactions_behind)
          VALUES (0, 2, 1, 3, 1, 1, 1, 100)
      changed_when: true
    - name: Load mysql_servers to runtime after galera hostgroups
      ansible.builtin.command:
        argv: [mysql, --protocol=tcp, -h127.0.0.1, -P6032, -uadmin, -N, -B, -e, "LOAD MYSQL SERVERS TO RUNTIME"]
      changed_when: true
    - name: Save mysql_servers to disk after galera hostgroups
      ansible.builtin.command:
        argv: [mysql, --protocol=tcp, -h127.0.0.1, -P6032, -uadmin, -N, -B, -e, "SAVE MYSQL SERVERS TO DISK"]
      changed_when: true
    - name: Clear ProxySQL mysql_query_rules
      ansible.builtin.command:
        argv: [mysql, --protocol=tcp, -h127.0.0.1, -P6032, -uadmin, -N, -B, -e, "DELETE FROM mysql_query_rules"]
      changed_when: true
    - name: Add ProxySQL query rules
      ansible.builtin.command:
        argv: [mysql, --protocol=tcp, -h127.0.0.1, -P6032, -uadmin, -N, -B, -e, "INSERT INTO mysql_query_rules (rule_id, active, match_digest, destination_hostgroup, apply) VALUES ({{ item.rule_id }}, 1, '{{ item.match_digest }}', {{ item.destination_hostgroup }}, 1)"]
      loop:
      - {rule_id: 1, match_digest: "^SELECT .* FOR UPDATE", destination_hostgroup: 0}
      - {rule_id: 2, match_digest: "^SELECT", destination_hostgroup: 1}
      - {rule_id: 3, match_digest: ".*", destination_hostgroup: 0}
      changed_when: true
    - name: Load mysql_query_rules to runtime
      ansible.builtin.command:
        argv: [mysql, --protocol=tcp, -h127.0.0.1, -P6032, -uadmin, -N, -B, -e, "LOAD MYSQL QUERY RULES TO RUNTIME"]
      changed_when: true
    - name: Save mysql_query_rules to disk
      ansible.builtin.command:
        argv: [mysql, --protocol=tcp, -h127.0.0.1, -P6032, -uadmin, -N, -B, -e, "SAVE MYSQL QUERY RULES TO DISK"]
      changed_when: true
  - name: Add Grafana Alloy apt key
    ansible.builtin.get_url:
      url: https://apt.grafana.com/gpg.key
      dest: /etc/apt/keyrings/grafana.gpg
      mode: '0644'
    when: enable_alloy | bool
  - name: Add Grafana apt repository
    ansible.builtin.copy:
      dest: /etc/apt/sources.list.d/grafana.list
      content: "deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://apt.grafana.com stable main\n"
      owner: root
      group: root
      mode: '0644'
    when: enable_alloy | bool
  - name: Install Grafana Alloy
    apt:
      pkg:
      - alloy
      state: latest
      update_cache: true
    when: not ansible_check_mode and enable_alloy | bool
  - name: Copy Alloy configuration for ProxySQL monitoring
    template:
      src: templates/alloy-proxysql.alloy.j2
      dest: /etc/alloy/config.alloy
      owner: alloy
      group: alloy
      mode: '0644'
    vars:
      proxysql_stats_user: "radmin"
      proxysql_stats_password: "{{ proxysql_admin_password }}"
    notify:
    - Restart Alloy
    when: enable_alloy | bool
  - name: Start and enable Alloy
    service:
      name: alloy
      state: started
      enabled: true
    when: enable_alloy | bool
  handlers:
  - name: Restart Keepalived
    service:
      name: keepalived
      state: restarted
  - name: Restart ProxySQL
    service:
      name: proxysql
      state: restarted
  - name: Restart Alloy
    service:
      name: alloy
      state: restarted
