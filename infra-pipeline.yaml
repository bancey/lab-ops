trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    exclude:
      - ansible/hosts.yaml
      - ansible/templates/frr.conf
      - kubernetes/*

pr:
  branches:
    include:
      - main
  paths:
    exclude:
      - ansible/hosts.yaml
      - ansible/templates/frr.conf
      - kubernetes/*

resources:
  repositories:
    - repository: azuredevops-lib
      type: github
      ref: refs/heads/main
      name: bancey/azuredevops-lib
      endpoint: bancey

parameters:
  - name: local_environments
    type: object
    default:
      - name: wanda
        address: "wanda.heimelska.co.uk"
      - name: thanos
        address: "thanos.heimelska.co.uk"
      - name: gamora
        address: "gamora.heimelska.co.uk"
      - name: nebula
        address: "nebula.heimelska.co.uk"
      - name: hela
        address: "hela.heimelska.co.uk"
      - name: loki
        address: "loki.heimelska.co.uk"
      - name: thor
        address: "thor.heimelska.co.uk"
  - name: terraform_deployments
    type: object
    default:
      - deployment: generate_ansible_inventory
        environment: prod
        component: inventory
        destroy: false
        deploy: true
        preSteps:
          - task: AzureCLI@2
            displayName: Download GitHub Private Key
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
            inputs:
              azureSubscription: "BTCS-PRODUCTION"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: az keyvault secret download --name GitHub-Bot-Private-Key --vault-name bancey-vault --file $(System.DefaultWorkingDirectory)/private-key.pem
        dependsOn: []
      - deployment: prod_twingate
        environment: prod
        component: twingate
        destroy: false
        deploy: true
        dependsOn: []
      - deployment: prod_entra
        environment: prod
        component: entra
        destroy: false
        deploy: true
        dependsOn: []
      - deployment: prod_dns
        environment: prod
        component: dns
        destroy: false
        deploy: true
        localEnvironments:
          - thanos
          - gamora
        dependsOn: []
      - deployment: wanda_virtual_machines
        environment: prod
        component: virtual-machines
        extraCommandArgs: -var "target_nodes=[\"wanda\"]"
        destroy: false
        deploy: true
        localEnvironments:
          - wanda
        dependsOn:
          - generate_ansible_inventory
        preSteps:
          - template: steps/install-sops-age.yaml@azuredevops-lib
            parameters:
              sopsVersion: "v3.10.2"
          - task: AzureCLI@2
            displayName: Get Age Key
            inputs:
              azureSubscription: "BTCS-PRODUCTION"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                mkdir -p ~/.config/sops/age
                az keyvault secret download --name Flux-Age-Key --vault-name bancey-vault --file ~/.config/sops/age/keys.txt
                chmod 600 ~/.config/sops/age/keys.txt
                ls -la ~/.config/sops/age
      - deployment: tiny_virtual_machines
        environment: prod
        component: virtual-machines
        extraCommandArgs: -var "target_nodes=[\"hela\",\"loki\",\"thor\"]"
        destroy: false
        deploy: true
        localEnvironments:
          - hela
          - loki
          - thor
        dependsOn:
          - generate_ansible_inventory
        preSteps:
          - template: steps/install-sops-age.yaml@azuredevops-lib
            parameters:
              sopsVersion: "v3.10.2"
          - task: AzureCLI@2
            displayName: Get Age Key
            inputs:
              azureSubscription: "BTCS-PRODUCTION"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                mkdir -p ~/.config/sops/age
                az keyvault secret download --name Flux-Age-Key --vault-name bancey-vault --file ~/.config/sops/age/keys.txt
                chmod 600 ~/.config/sops/age/keys.txt
                ls -la ~/.config/sops/age
  - name: ansible_deployments
    type: object
    default:
      - deployment: rpi_ansible
        environment: prod
        playbook: rpi-ha.yaml
        secrets:
          - keepalived-pass
          - Twingate-banceylab-connector-Refresh-Token
          - Twingate-banceylab-connector-Access-Token
          - Twingate-banceylab-connector-2-Refresh-Token
          - Twingate-banceylab-connector-2-Access-Token
          - BunkerWeb-DB-Password
          - BunkerWeb-TOTP-Secrets
          - BunkerWeb-MGMT-Admin-Username
          - BunkerWeb-MGMT-Admin-Password
          - Cloudflare-Lab-API-Token
          - Adguard-Thanos-Username
          - Adguard-Thanos-Password
          - Discord-Gatus-Webhook-URL
        localEnvironments:
          - thanos
          - gamora
          - nebula
        dependsOn:
          - generate_ansible_inventory
      - deployment: nut_server_ansible
        environment: prod
        playbook: nut-server.yaml
        secrets:
          - NUT-Admin-Password
          - NUT-Monitor-Password
        localEnvironments:
          - gamora
        dependsOn:
          - generate_ansible_inventory
      - deployment: scansnap_ansible
        environment: prod
        playbook: scansnap.yaml
        secrets:
          - Paperless-API-Token
        localEnvironments:
          - gamora
        dependsOn:
          - generate_ansible_inventory
      - deployment: nut_client_ansible
        environment: prod
        playbook: nut-client.yaml
        secrets:
          - NUT-Monitor-Password
        localEnvironments:
          - hela
          - loki
          - thor
          - wanda
        dependsOn:
          - generate_ansible_inventory
          - nut_server_ansible

variables:
  - name: agentImage
    value: ubuntu-latest
  - name: stateStorageAccount
    value: banceystatestor
  - name: serviceConnection
    value: "BTCS-PRODUCTION"

stages:
  - template: stages/check-hosts-online.yaml@azuredevops-lib
    parameters:
      dependencies: prod_twingate
      keyVaultName: bancey-vault
      serviceKeySecretName: Twingate-AzureDevOps-SA-Key
      serviceConnection: $(serviceConnection)
      hosts: ${{ parameters.local_environments }}
  - ${{ each deployment in parameters.terraform_deployments }}:
      - stage: ${{ deployment.deployment }}
        ${{ if and(deployment.localEnvironments, gt(length(join('', deployment.dependsOn)), 0)) }}:
          dependsOn: ${{ split(format('{0},{1}', join(',', deployment.dependsOn), 'check_hosts_online'), ',') }}
        ${{ elseif deployment.localEnvironments }}:
          dependsOn: check_hosts_online
        ${{ else }}:
          dependsOn: ${{ deployment.dependsOn }}
        jobs:
          - ${{ if deployment.localEnvironments }}:
              - template: jobs/hosts-online-precheck.yaml@azuredevops-lib
                parameters:
                  localEnvironments: ${{ deployment.localEnvironments }}
          - job: TerraformPlanApply
            ${{ if deployment.localEnvironments }}:
              dependsOn: AllHostsOnlinePreCheck
              condition: and(succeeded(), eq(dependencies.AllHostsOnlinePreCheck.outputs['consolidate_hosts_online.allHostsOnline'], 'true'))
            ${{ else }}:
              condition: succeeded()
            pool:
              vmImage: $(agentImage)
            steps:
              - ${{ if deployment.preSteps }}:
                  - ${{ deployment.preSteps }}
              - ${{ if deployment.localEnvironments }}:
                  - template: steps/twingate-connect.yaml@azuredevops-lib
                    parameters:
                      keyVaultName: bancey-vault
                      serviceKeySecretName: Twingate-AzureDevOps-SA-Key
                      serviceConnection: $(serviceConnection)
              - ${{ if eq(deployment.component, 'virtual-machines') }}:
                  - template: steps/ansible.yaml@azuredevops-lib
                    parameters:
                      serviceConnection: $(serviceConnection)
                      keyVaultName: bancey-vault
                      privateKeySecretName: Packer-Private-Key
              - template: steps/terraform.yaml@azuredevops-lib
                parameters:
                  backendStorageAccount: $(stateStorageAccount)
                  workingDirectory: $(System.DefaultWorkingDirectory)/terraform/components/${{ deployment.component }}
                  azureRmKey: tfstate/${{ deployment.deployment }}.tfstate
                  serviceConnection: $(serviceConnection)
                  variableFilePath: $(System.DefaultWorkingDirectory)/terraform/environments/${{ deployment.environment }}/${{ deployment.environment }}.tfvars
                  ${{ if ne(deployment.extraCommandArgs, '') }}:
                    extraCommandArgs: ${{ deployment.extraCommandArgs }}
                  runApply: ${{ and(eq(deployment.deploy, true), eq(variables['Build.SourceBranch'], 'refs/heads/main')) }}
                  runDestroy: ${{ and(eq(deployment.destroy, true), eq(variables['Build.SourceBranch'], 'refs/heads/main')) }}
              - ${{ if deployment.postStep }}:
                  - ${{ deployment.postStep }}

  - stage: sync_entra_secrets
    dependsOn: prod_entra
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: SyncEntraSecrets
        pool:
          vmImage: $(agentImage)
        steps:
          - checkout: self
            persistCredentials: true
          - template: steps/install-sops-age.yaml@azuredevops-lib
            parameters:
              sopsVersion: "v3.10.2"
          - task: AzureCLI@2.279.1
            displayName: Get Age Key
            inputs:
              azureSubscription: "BTCS-PRODUCTION"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                mkdir -p ~/.config/sops/age
                az keyvault secret download --name Flux-Age-Key --vault-name bancey-vault --file ~/.config/sops/age/keys.txt
                chmod 600 ~/.config/sops/age/keys.txt
          - task: AzureCLI@2.279.1
            displayName: Regenerate SOPS secrets from Key Vault
            inputs:
              azureSubscription: "BTCS-PRODUCTION"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              workingDirectory: $(System.DefaultWorkingDirectory)
              inlineScript: |
                set -euo pipefail

                ./scripts/sync-entra-secret.sh --app lab-oauth2-proxy \
                  --target kubernetes/apps/tiny/oauth2-proxy-secret.sops.yaml \
                  --name oauth2-proxy-entra --namespace oauth2-proxy \
                  --extra-random cookie-secret

                # wanda must use the *same* cookie secret as tiny, otherwise a session issued by
                # one cluster is not accepted by the other and SSO stops being single sign-on.
                # Read it back rather than relying on --extra-random preserving an existing value,
                # which would silently diverge if the wanda file were ever recreated from scratch.
                COOKIE_SECRET="$(sops -d kubernetes/apps/tiny/oauth2-proxy-secret.sops.yaml \
                  | python3 -c 'import sys,yaml; print(yaml.safe_load(sys.stdin)["stringData"]["cookie-secret"])')"
                ./scripts/sync-entra-secret.sh --app lab-oauth2-proxy \
                  --target kubernetes/apps/wanda/oauth2-proxy-secret.sops.yaml \
                  --name oauth2-proxy-entra --namespace oauth2-proxy \
                  --extra "cookie-secret=$COOKIE_SECRET"

                ./scripts/sync-entra-secret.sh --app lab-grafana \
                  --target kubernetes/apps/tiny/grafana-oidc-secret.sops.yaml \
                  --name grafana-oidc --namespace monitoring

                ./scripts/sync-entra-secret.sh --app lab-vikunja \
                  --target kubernetes/apps/tiny/vikunja-oidc-secret.sops.yaml \
                  --name vikunja-oidc --namespace vikunja

                ./scripts/sync-entra-secret.sh --app lab-paperless \
                  --target kubernetes/apps/tiny/paperless-ngx-oidc-secret.sops.yaml \
                  --name paperless-oidc --namespace paperless-ngx \
                  --extra-template 'PAPERLESS_SOCIALACCOUNT_PROVIDERS={"openid_connect":{"APPS":[{"provider_id":"entra","name":"Entra ID","client_id":"{client_id}","secret":"{client_secret}","settings":{"server_url":"https://login.microsoftonline.com/efc9b6c0-5193-43b1-a5a7-2ef3f29cd613/v2.0/.well-known/openid-configuration"}}]}}'
          - script: |
              set -euo pipefail
              if [ -z "$(git status --porcelain kubernetes/)" ]; then
                echo "No SOPS secret changed - nothing to commit."
                exit 0
              fi
              git config user.email "bot@bancey.xyz"
              git config user.name "lab-ops bot"
              git add kubernetes/
              git commit -m "chore: rotate Entra ID SOPS secrets [skip ci]"
              git push origin "HEAD:main"
            displayName: Commit rotated secrets
            workingDirectory: $(System.DefaultWorkingDirectory)
  - ${{ each ansible_deployment in parameters.ansible_deployments }}:
      - stage: ${{ ansible_deployment.deployment }}
        ${{ if and(ansible_deployment.localEnvironments, gt(length(join('', ansible_deployment.dependsOn)), 0)) }}:
          dependsOn: ${{ split(format('{0},{1}', join(',', ansible_deployment.dependsOn), 'check_hosts_online'), ',') }}
        ${{ elseif ansible_deployment.localEnvironments }}:
          dependsOn: check_hosts_online
        ${{ else }}:
          dependsOn: ${{ ansible_deployment.dependsOn }}
        jobs:
          - ${{ if ansible_deployment.localEnvironments }}:
              - template: jobs/hosts-online-precheck.yaml@azuredevops-lib
                parameters:
                  localEnvironments: ${{ ansible_deployment.localEnvironments }}
              - job: AnsibleCheckRun
                ${{ if ansible_deployment.localEnvironments }}:
                  dependsOn: AllHostsOnlinePreCheck
                  condition: and(succeeded(), eq(dependencies.AllHostsOnlinePreCheck.outputs['consolidate_hosts_online.allHostsOnline'], 'true'))
                ${{ else }}:
                  condition: succeeded()
                pool:
                  vmImage: $(agentImage)
                steps:
                  - template: steps/twingate-connect.yaml@azuredevops-lib
                    parameters:
                      keyVaultName: bancey-vault
                      serviceKeySecretName: Twingate-AzureDevOps-SA-Key
                      serviceConnection: $(serviceConnection)
                  - script: |
                      git fetch origin main
                      git checkout FETCH_HEAD -- ansible/hosts.yaml
                    displayName: Refresh generated Ansible inventory
                    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
                  - template: steps/ansible.yaml@azuredevops-lib
                    parameters:
                      serviceConnection: $(serviceConnection)
                      keyVaultName: bancey-vault
                      privateKeySecretName: Packer-Private-Key
                      playbook: ${{ ansible_deployment.playbook }}
                      secrets: ${{ ansible_deployment.secrets }}
                      requirementsFile: ${{ ansible_deployment.requirementsFile }}
