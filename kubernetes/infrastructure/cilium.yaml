---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  releaseName: cilium
  chart:
    spec:
      chart: cilium
      version: 1.20.1
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  interval: 5m
  timeout: 30m
  install:
    remediation:
      retries: 3
  values:
    # Multus (tiny cluster only, kubernetes/infrastructure-tiny) needs to chain
    # in front of Cilium. Cilium's default CNI-exclusive mode silently renames
    # any other CNI config in /etc/cni/net.d to *.cilium_bak to guarantee it's
    # the only CNI in control, which blocks that chaining. Harmless to disable
    # here for wanda too, since nothing else writes a competing CNI config there.
    cni:
      exclusive: false
    bgpControlPlane:
      enabled: true
    hubble:
      enabled: true
      relay:
        enabled: true
      ui:
        enabled: true
    ipam:
      operator:
        clusterPoolIPv4MaskSize: 23
        clusterPoolIPv4PodCIDRList:
          - 10.42.0.0/16
    k8sServiceHost: 10.10.10.10
    k8sServicePort: 6443
    kubeProxyReplacement: true
