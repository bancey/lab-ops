---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: seerr
  namespace: seerr
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: ""
      kind: Rule
      services:
        - name: seerr
          port: 5055
      # No forwardAuth: Seerr's own Plex sign-in is the gate, and keeping the API free of
      # oauth2-proxy leaves room for request bots (Requestrr/Doplarr) later.
      middlewares:
        - name: default-headers
          namespace: traefik
  tls:
    secretName: seerr-tls
