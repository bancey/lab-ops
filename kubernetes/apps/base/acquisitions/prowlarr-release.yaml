---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
  namespace: acquisition
spec:
  releaseName: prowlarr
  chart:
    spec:
      version: 0.2.7
      chart: xarr
      sourceRef:
        kind: HelmRepository
        name: bancey
        namespace: flux-system
  interval: 1h0m0s
  timeout: 10m
  install:
    remediation:
      retries: 3
  # There is no environment variable for the authentication method - it lives in config.xml on
  # the config PVC, hence the initContainer. AuthenticationMethod=External hands authentication
  # to the reverse proxy; DisabledForLocalAddresses keeps in-cluster API traffic working
  # (Prowlarr -> Sonarr/Radarr sync, *arr -> SABnzbd), which never passes through Traefik.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: prowlarr-xarr
            patch: |
              - op: add
                path: /spec/template/spec/initContainers
                value:
                  - name: set-external-auth
                    image: busybox:1.38
                    command: ["/bin/sh", "-c"]
                    args:
                      - |
                        set -eu
                        f=/config/config.xml
                        if [ ! -f "$f" ]; then
                          echo "no config.xml yet, first run - nothing to do"
                          exit 0
                        fi
                        set_element() {
                          name=$1
                          value=$2
                          if grep -q "<$name>" "$f"; then
                            sed -i "s#<$name>[^<]*</$name>#<$name>$value</$name>#g" "$f"
                          else
                            sed -i "s#</Config>#  <$name>$value</$name>\n</Config>#" "$f"
                          fi
                        }
                        set_element AuthenticationMethod External
                        set_element AuthenticationRequired DisabledForLocalAddresses
                        grep -E "Authentication(Method|Required)" "$f"
                    volumeMounts:
                      - name: config
                        mountPath: /config
  values:
    image: linuxserver/prowlarr:2.6.5
    config:
      port: 9696
    # PVC names should be configured in cluster overlays
    persistence:
      config:
        enabled: true
        claimName: prowlarr-config-pvc
      data:
        enabled: false
