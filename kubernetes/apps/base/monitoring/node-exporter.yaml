---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-node-exporter
  namespace: monitoring
spec:
  releaseName: prometheus-node-exporter
  chart:
    spec:
      version: 5.1.0
      chart: prometheus-node-exporter
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  interval: 30m
  timeout: 15m
  install:
    remediation:
      retries: 3
  values:
    # Chart >=4.60 emits prometheus.io/scrape itself when this is true, which
    # duplicates the explicit "false" annotation below. Alloy discovers by label.
    prometheusScrape: false
    service:
      port: 9100
      targetPort: 9100
      annotations:
        prometheus.io/scrape: "false"
    affinity: {}
    tolerations:
      - operator: Exists
