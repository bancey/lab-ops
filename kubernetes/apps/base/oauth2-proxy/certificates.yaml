---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: oauth2-proxy-staging-tls
  namespace: oauth2-proxy
spec:
  secretName: oauth2-proxy-staging-tls
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
  commonName: "oauth2-proxy-fqdn"
  dnsNames:
    - "oauth2-proxy-fqdn"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: oauth2-proxy-tls
  namespace: oauth2-proxy
spec:
  secretName: oauth2-proxy-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "oauth2-proxy-fqdn"
  dnsNames:
    - "oauth2-proxy-fqdn"
