---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-ngx
  namespace: paperless-ngx
spec:
  values:
    # The provider config is an env var, fixed at pod creation, so a rotation needs a restart.
    controller:
      annotations:
        secret.reloader.stakater.com/reload: paperless-oidc
    env:
      PAPERLESS_URL: "https://paperless.tiny.heimelska.co.uk"
      # allauth wants the whole provider config, client secret included, as one JSON blob, so
      # the Secret holds the rendered blob rather than the credential on its own.
      #
      # The regular Django login stays enabled on purpose. Set PAPERLESS_DISABLE_REGULAR_LOGIN
      # and PAPERLESS_REDIRECT_LOGIN_TO_SSO to "true" only once an Entra sign-in has worked.
      PAPERLESS_APPS: "allauth.socialaccount.providers.openid_connect"
      PAPERLESS_SOCIAL_AUTO_SIGNUP: "true"
      PAPERLESS_SOCIALACCOUNT_PROVIDERS:
        valueFrom:
          secretKeyRef:
            name: paperless-oidc
            key: PAPERLESS_SOCIALACCOUNT_PROVIDERS
    persistence:
      data:
        storageClass: unas-nfs-csi
      media:
        storageClass: unas-nfs-csi
      export:
        storageClass: unas-nfs-csi
      consume:
        storageClass: unas-nfs-csi
