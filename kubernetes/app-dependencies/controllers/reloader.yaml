---
# Restarts workloads when a Secret they reference changes. Env vars from secretKeyRef are fixed at
# pod creation, so without this a rotated Entra client secret would leave oauth2-proxy running with
# the dead credential. Opt-in: workloads name the Secret with secret.reloader.stakater.com/reload.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: reloader
spec:
  releaseName: reloader
  chart:
    spec:
      version: 2.2.17
      chart: reloader
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
  interval: 1h0m0s
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    reloader:
      watchGlobally: true
      reloadStrategy: annotations
      ignoreSecrets: false
      ignoreConfigMaps: false
      deployment:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
